# Deploy to Stage: applies new migrations to the stage Supabase project, then moves the `stage`
# branch to the chosen commit, which Vercel builds at stage.awebound.store with the Preview
# variables. Run it from Actions → Deploy to Stage. Secrets and setup: docs/DEPLOYMENT.md →
# Stage and production.
name: Deploy to Stage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: deploy-stage
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGE_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGE_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: supabase/setup-cli@v3
      - name: Apply migrations to stage
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, STAGE_SUPABASE_PROJECT_REF and STAGE_SUPABASE_DB_PASSWORD as repository secrets."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --yes 2>&1 | tee push.log
      - name: Move stage to this commit
        run: git push --force origin HEAD:refs/heads/stage
      - name: Summary
        run: |
          {
            echo "Stage is at \`$(git rev-parse --short HEAD)\`. Vercel is building it at https://stage.awebound.store."
            echo '```'
            cat push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
