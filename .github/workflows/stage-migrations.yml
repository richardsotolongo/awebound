# Applies new migrations to the stage Supabase project when they reach the `stage` branch. Vercel
# deploys `stage` to stage.awebound.store on its own; a minute of new code on the old schema
# doesn't matter there. Run it by hand (on any branch) the first time and after restoring a paused
# project.
# Secrets and setup: docs/DEPLOYMENT.md.
name: Stage migrations

on:
  push:
    branches: [stage]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-migrations
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGE_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGE_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
      - name: Apply migrations to stage
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, STAGE_SUPABASE_PROJECT_REF and STAGE_SUPABASE_DB_PASSWORD as repository secrets."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --yes 2>&1 | tee push.log
      - name: Summary
        run: |
          {
            echo "Stage database is at \`$(git rev-parse --short HEAD)\`."
            echo '```'
            cat push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
