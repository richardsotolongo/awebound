# Deploy to Prod: ships exactly what is on `stage`. Applies new migrations to the production
# Supabase project, then fast-forwards the `production` branch, which Vercel builds at
# www.awebound.store. The push never forces, so it stops if `production` has commits `stage`
# lacks. Run it from Actions → Deploy to Prod. Secrets and setup: docs/DEPLOYMENT.md.
name: Deploy to Prod

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage
      - uses: supabase/setup-cli@v3
      - name: Apply migrations to production
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, PROD_SUPABASE_PROJECT_REF and PROD_SUPABASE_DB_PASSWORD as repository secrets."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --yes 2>&1 | tee push.log
      - name: Move production to this commit
        run: git push origin HEAD:refs/heads/production
      - name: Summary
        run: |
          {
            echo "Production is at \`$(git rev-parse --short HEAD)\`. Vercel is building it at https://www.awebound.store."
            echo '```'
            cat push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
