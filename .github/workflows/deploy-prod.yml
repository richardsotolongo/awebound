# Deploy to Prod: every push to main (a merged stage → main pull request) applies new migrations
# to the production Supabase project, then asks Vercel to build main through a Deploy Hook.
# Vercel never deploys main on its own (git.deploymentEnabled in apps/web/vercel.json), so the
# live site never runs code ahead of its migrations. Run it by hand to redeploy. Secrets and
# setup: docs/DEPLOYMENT.md.
name: Deploy to Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
      DEPLOY_HOOK: ${{ secrets.VERCEL_PROD_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
      - name: Apply migrations to production
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ] || [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, PROD_SUPABASE_PROJECT_REF, PROD_SUPABASE_DB_PASSWORD and VERCEL_PROD_DEPLOY_HOOK as repository secrets."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --yes 2>&1 | tee push.log
      - name: Deploy main on Vercel
        run: curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK"
      - name: Summary
        run: |
          {
            echo "Production database is at \`$(git rev-parse --short HEAD)\`, and Vercel is building main for https://www.awebound.store."
            echo '```'
            cat push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
