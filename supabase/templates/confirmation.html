<!doctype html>
<!-- Awebound confirm-email template (Supabase "Confirm signup"). Only sent if email confirmations are
     turned on; with passwordless sign-in the magic-link email does the confirming.
     Inline hex mirrors packages/brand/src/styles/tokens.css because email clients ignore CSS variables. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Confirm your email for Awebound</title>
  </head>
  <body style="margin:0;padding:0;background:#E8DDC9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E8DDC9;">
      <tr>
        <td align="center" style="padding:48px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
            <tr>
              <td align="center" style="padding-bottom:32px;">
                <img src="{{ .SiteURL }}/email/wordmark-oxblood.png" width="200" height="93" alt="Awebound" style="display:block;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="background:#F8F2E7;border:1px solid #CFC4B1;padding:40px 32px;font-family:Archivo,'Helvetica Neue',Arial,sans-serif;color:#151413;">
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#4A443D;">Welcome</p>
                <p style="margin:0 0 24px;font-size:17px;line-height:27px;">Confirm this address to finish setting up your Awebound account.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 28px;">
                  <tr>
                    <td style="background:#782B35;border-radius:2px;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/account" style="display:inline-block;padding:15px 28px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#F0E6D2;text-decoration:none;font-weight:600;">Confirm email</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 8px;font-size:14px;line-height:21px;color:#4A443D;">Or enter this code on the sign-in page:</p>
                <p style="margin:0 0 28px;font-size:28px;line-height:32px;letter-spacing:.32em;font-weight:600;color:#151413;">{{ .Token }}</p>
                <p style="margin:0;font-size:14px;line-height:21px;color:#4A443D;">If you didn’t create an account, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
